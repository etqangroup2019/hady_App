name: Build and publish web app

# عند كل رفع على الفرع الرئيسي: يبني التطبيق وينشره على فرع gh-pages.
# GitHub Pages وCloudflare Pages يقرآن من هذا الفرع نفسه (انظر README).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        run: |
          flutter build web --release \
            --dart-define=BUILD=$(git rev-list --count HEAD) \
            --dart-define=COMMIT=$(git rev-parse --short HEAD) \
            --dart-define=BUILT=$(date +%s)

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
