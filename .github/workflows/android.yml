name: Build Android APK

# يبني ملف APK جاهزاً للتثبيت. شغّله يدوياً: Actions ← Build Android APK ← Run workflow
# ثم نزّل الملف من قسم Artifacts في آخر الصفحة.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android project
        run: flutter create --platforms=android --org com.hady --project-name sunnah_day .

      - name: Patch android project
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hady-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
